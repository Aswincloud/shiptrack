version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it. Minor/patch bumps are
    # auto-merged and deployed, so this gives time for a hijacked or broken
    # release to be noticed and pulled before it reaches production.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Minor and patch bumps arrive as one weekly PR, which
    # dependabot-automerge.yml merges once both Workers builds pass. Majors
    # (e.g. TypeScript 5 -> 7) stay ungrouped, one PR each, for a human to
    # review: they're what broke `npm ci` in #8.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
