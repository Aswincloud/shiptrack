name: CI

# Fast gate that runs on every PR and on main: typecheck, lint, and the parser
# unit tests. The Cloudflare Workers builds already run `next build` (which does
# its own typecheck + lint), but they don't run the tests and they only report
# from the Cloudflare side — this job is a required status check in the branch
# ruleset so a red test actually blocks a merge.
on:
  push:
    branches: [main]
  pull_request:
  # main merges through a merge queue, which runs required checks on the
  # merge_group ref. Without this the `test` check never reports in the queue
  # and the merge hangs until it times out.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
